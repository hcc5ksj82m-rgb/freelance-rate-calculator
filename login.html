  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
<title>Log in — PackEV</title>
  <meta name="description" content="Log in to your PackEV member account." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <span class="brand">PackEV</span>
      <a href="index.html">Sets</a>
      <a href="prices.html">Prices</a>
      <a href="rip.html">Pack EV</a>
      <a href="ev.html">EV board</a>
      <a href="shows.html">Shows</a>
      <a href="forum.html">Forum</a>
      <a href="about.html">About</a>
      <span id="auth-nav" class="auth-nav">
        <a href="join.html">Join</a>
        <a href="login.html">Log in</a>
      </span>
    </nav>
    <div class="card auth-card">
      <span class="pill">MEMBERS</span>
      <h1>Log in</h1>
      <p class="lead">Sign in to manage your PackEV profile.</p>
      <div id="auth-config-banner"></div>
      <form id="login-form" class="auth-form" novalidate>
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Your password" />
        <button type="submit">Log in</button>
      </form>
      <p id="auth-form-msg" class="auth-msg" hidden></p>
      <p class="tip">New here? <a href="join.html">Join PackEV</a></p>
    </div>
    <footer>PackEV</footer>
  </div>
  <script src="border.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
