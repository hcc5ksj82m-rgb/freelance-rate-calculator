<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Profit Calculator — RateLab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
        <nav class="nav">
      <span class="brand">RateLab</span>
      <a href="index.html">Calculator</a>
      <a href="pricing.html">Pricing</a>
      <a href="pokemon.html">Pokemon</a>
      <a href="profit.html">Profit</a>
      <a href="earn.html">Earn</a>
      <a href="hire.html">Hire</a>
    </nav>
    <div class="card">
      <span class="pill">MONEY TOOL</span>
      <h1>Card flip profit calculator</h1>
      <p class="lead">Buy price vs sell price, fees, and shipping — see if a flip is worth it.</p>
      <div class="grid two">
        <div><label>Buy price ($)</label><input id="buy" type="number" value="40" step="0.01" /></div>
        <div><label>Expected sell ($)</label><input id="sell" type="number" value="65" step="0.01" /></div>
        <div><label>Marketplace fee %</label><input id="fee" type="number" value="13" step="0.1" /></div>
        <div><label>Shipping / materials ($)</label><input id="ship" type="number" value="5" step="0.01" /></div>
      </div>
      <button type="button" id="go">Calculate profit</button>
      <div class="result" id="result" style="display:none">
        <div>Estimated profit</div>
        <strong id="profit"></strong>
        <p class="tip" id="tip"></p>
      </div>
    </div>
    <footer>RateLab</footer>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    $("go").onclick = () => {
      const buy = +$("buy").value, sell = +$("sell").value, fee = +$("fee").value, ship = +$("ship").value;
      const fees = sell * (fee/100);
      const net = sell - fees - ship - buy;
      $("result").style.display = "block";
      $("profit").textContent = (net>=0?"+$":"-$") + Math.abs(net).toFixed(2);
      $("tip").textContent = `After ~$${fees.toFixed(2)} fees and $${ship.toFixed(2)} costs. ROI ${buy?((net/buy)*100).toFixed(1):0}%.`;
    };
  </script>
</body>
</html>
