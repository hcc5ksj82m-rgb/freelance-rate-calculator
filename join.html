<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join PackEV</title>
  <meta name="description" content="Create a PackEV member account. Members access their own profile only — never GitHub or site files." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <span class="brand">PackEV</span>
      <a href="index.html">Sets</a>
      <a href="prices.html">Prices</a>
      <a href="rip.html">Pack EV</a>
      <a href="forum.html">Forum</a>
      <a href="about.html">About</a>
      <span id="auth-nav" class="auth-nav">
        <a href="join.html">Join</a>
        <a href="login.html">Log in</a>
      </span>
    </nav>
    <div class="card auth-card">
      <span class="pill">MEMBERS</span>
      <h1>Join PackEV</h1>
      <p class="lead">Create an account to save your profile. You never get GitHub access — only your own data via secure policies.</p>
      <div id="auth-config-banner"></div>
      <form id="join-form" class="auth-form" novalidate>
        <label for="join-name">Display name</label>
        <input id="join-name" name="name" type="text" autocomplete="nickname" placeholder="Trainer name" maxlength="80" />
        <label for="join-email">Email</label>
        <input id="join-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        <label for="join-password">Password</label>
        <input id="join-password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" />
        <button type="submit">Create account</button>
      </form>
      <p id="auth-form-msg" class="auth-msg" hidden></p>
      <p class="tip">Already a member? <a href="login.html">Log in</a> · See <a href="AUTH.md">security model</a></p>
    </div>
    <footer>PackEV</footer>
  </div>
  <script src="border.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
