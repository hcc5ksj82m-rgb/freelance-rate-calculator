<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freelance Rate Calculator — free</title>
  <meta name="description" content="Free freelance hourly rate calculator. Turn your income goal into a fair rate." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
        <nav class="nav">
      <span class="brand">RateLab</span>
      <a href="index.html">Calculator</a>
      <a href="pricing.html">Pricing</a>
      <a href="pokemon.html">Pokemon</a>
      <a href="hire.html">Hire</a>
    </nav>
    <div class="card">
      <span class="pill">FREE TOOL</span>
      <h1>Freelance Rate Calculator</h1>
      <p class="lead">Find a fair hourly rate from your income goal — then use the guide to quote real jobs.</p>
      <div class="grid two">
        <div>
          <label for="goal">Yearly income goal ($)</label>
          <input id="goal" type="number" value="60000" min="0" />
        </div>
        <div>
          <label for="costs">Yearly business costs ($)</label>
          <input id="costs" type="number" value="5000" min="0" />
        </div>
        <div>
          <label for="weeks">Weeks worked / year</label>
          <input id="weeks" type="number" value="48" min="1" max="52" />
        </div>
        <div>
          <label for="hours">Billable hours / week</label>
          <input id="hours" type="number" value="25" min="1" />
        </div>
      </div>
      <button type="button" id="go">Calculate my rate</button>
      <div class="result" id="result">
        <div>Suggested hourly rate</div>
        <strong id="rate"></strong>
        <p class="tip" id="tip"></p>
        <p class="tip"><a href="pricing.html">Next: how to turn this into a client quote →</a></p>
      </div>
    </div>
    <footer>RateLab · Built to learn & earn</footer>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    $("go").onclick = () => {
      const goal = +$("goal").value || 0;
      const weeks = +$("weeks").value || 1;
      const hours = +$("hours").value || 1;
      const costs = +$("costs").value || 0;
      const billable = weeks * hours;
      const rate = billable ? (goal + costs) / billable : 0;
      $("result").style.display = "block";
      $("rate").textContent = "$" + rate.toFixed(2) + " / hour";
      $("tip").textContent = `Based on ${billable} billable hours/year. Round up for tax & unpaid admin.`;
    };
  </script>
</body>
</html>
