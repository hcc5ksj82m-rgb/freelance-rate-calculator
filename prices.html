<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokemon card prices — PackEV</title>
  <meta name="description" content="Search Pokemon TCG cards by name for live TCGPlayer and Cardmarket prices." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <span class="brand">PackEV</span>
      <a href="index.html">Sets</a>
      <a href="prices.html">Prices</a>
      <a href="rip.html">Pack EV</a>
      <a href="forum.html">Forum</a>
      <a href="about.html">About</a>
      <span id="auth-nav" class="auth-nav">
        <a href="join.html">Join</a>
        <a href="login.html">Log in</a>
      </span>
    </nav>
    <div class="card">
      <h1>Pokemon card prices</h1>
      <p class="lead">Search any card by name in our catalog (~19k cards). Click a result to open the card page — market price, eBay sold search, and real price-history charts (no demo data).</p>

      <div class="toolbar">
        <div style="flex:2;min-width:200px">
          <label for="q">Search card name</label>
          <input id="q" type="search" placeholder="Charizard, Umbreon, Iono…" autocomplete="off" />
        </div>
      </div>

      <section id="searchSection" class="search-section" hidden>
        <h2>Search results</h2>
        <div id="searchStatus" class="expand-status"></div>
        <div class="chart" id="searchChart"></div>
        <div id="searchGrid" class="price-grid"></div>
      </section>
    </div>
    <footer>PackEV · educational prices</footer>
  </div>
  <script src="border.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cards-fetch.js"></script>
  <script src="js/graded.js"></script>
  <script src="js/prices.js"></script>
</body>
</html>
