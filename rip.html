<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.pokemontcg.io https://cdn.jsdelivr.net;" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f59e0b'/%3E%3C/svg%3E" />
  <title>Cost of ripping — PackEV</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <span class="brand">PackEV</span>
      <a href="index.html">Sets</a>
      <a href="prices.html">Prices</a>
      <a href="rip.html">Pack EV</a>
      <a href="shows.html">Shows</a>
      <a href="forum.html">Forum</a>
      <a href="about.html">About</a>
      <span id="auth-nav" class="auth-nav">
        <a href="join.html">Join</a>
        <a href="login.html">Log in</a>
      </span>
    </nav>
    <div class="card rip">
      <h1>Cost of ripping</h1>
      <label for="set">Set</label>
      <input id="setFilter" type="search" placeholder="Search sets" aria-label="Search sets" autocomplete="off" />
      <select id="set"></select>
      <div class="rip-cost-head">
        <label for="cost">Pack cost</label>
        <a id="ebayLink" class="rip-ebay" href="#" target="_blank" rel="noopener">eBay sold</a>
      </div>
      <input id="cost" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" />
      <p id="ripLine" class="rip-line" aria-live="polite">—</p>
      <p class="rip-note">Estimates only</p>
      <h2>Top cards</h2>
      <ul id="chaseList" class="rip-cards"></ul>
    </div>
    <footer>PackEV</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let setsById = {};
    let allSets = [];
    let chaseGen = 0;

    /* Same rarity bands already used on the set page, written as "1 in N". */
    const RARITY_ODDS = {
      'Special Illustration Rare': '1 in 40–90 packs',
      'Illustration Rare': '1 in 12–20 packs',
      'Hyper Rare': '1 in 80–160 packs',
      'Double Rare': '1 in 6–10 packs',
      'Rare Rainbow': '1 in 60–150 packs',
      'Rare Secret': '1 in 40–100 packs',
      'Rare Ultra': '1 in 6–12 packs',
      'Rare Holo': '1 in 3–6 packs',
      'Rare': '1 in 1 pack'
    };

    function money(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return '—';
      return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function oddsText(rarity) {
      if (!rarity) return '';
      if (Object.prototype.hasOwnProperty.call(RARITY_ODDS, rarity)) return RARITY_ODDS[rarity];
      const r = String(rarity).toLowerCase();
      const key = Object.keys(RARITY_ODDS)
        .sort((a, b) => b.length - a.length)
        .find(k => r.includes(k.toLowerCase()));
      return key ? RARITY_ODDS[key] : '';
    }

    function modelOf(s) {
      return {
        dead: s && s.evDeadUsd != null ? Number(s.evDeadUsd) : 1.2,
        odds: s && s.evChaseOdds != null ? Number(s.evChaseOdds) : 72,
        chase: s && s.evChaseUsd != null ? Number(s.evChaseUsd) : 85
      };
    }

    function emptyChase(text) {
      const list = $('chaseList');
      list.innerHTML = '';
      const li = document.createElement('li');
      li.className = 'rip-empty';
      li.textContent = text;
      list.appendChild(li);
    }

    function renderChase(rows) {
      const list = $('chaseList');
      list.innerHTML = '';
      rows.forEach(function (r) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = 'card.html?id=' + encodeURIComponent(r.id);
        if (r.image_small) {
          const img = document.createElement('img');
          img.alt = '';
          img.loading = 'lazy';
          img.src = r.image_small;
          a.appendChild(img);
        } else {
          const ph = document.createElement('span');
          ph.className = 'rip-ph';
          a.appendChild(ph);
        }
        const name = document.createElement('span');
        name.className = 'rip-name';
        name.textContent = r.name || 'Card';
        const price = document.createElement('span');
        price.className = 'rip-price';
        price.textContent = money(r.market_price_usd);
        a.appendChild(name);
        a.appendChild(price);
        const odds = oddsText(r.rarity);
        if (odds) {
          const o = document.createElement('span');
          o.className = 'rip-odds';
          o.textContent = odds;
          a.appendChild(o);
        }
        li.appendChild(a);
        list.appendChild(li);
      });
    }

    async function loadChase(setId) {
      const gen = ++chaseGen;
      if (!setId) {
        emptyChase('None yet');
        return;
      }
      emptyChase('Loading…');
      const cfg = window.PACK_EV_SUPABASE || {};
      const base = String(cfg.SUPABASE_URL || '').replace(/\/$/, '');
      const key = String(cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_PUBLISHABLE_KEY || '');
      if (!base || !key) {
        emptyChase('None yet');
        return;
      }
      try {
        const url = base + '/rest/v1/cards'
          + '?select=id,name,number,rarity,market_price_usd,image_small'
          + '&set_id=eq.' + encodeURIComponent(setId)
          + '&market_price_usd=not.is.null&market_price_usd=gte.15'
          + '&order=market_price_usd.desc&limit=5';
        const res = await fetch(url, {
          headers: {
            Accept: 'application/json',
            apikey: key,
            Authorization: 'Bearer ' + key
          }
        });
        if (gen !== chaseGen) return;
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();
        if (gen !== chaseGen) return;
        if (!Array.isArray(rows) || !rows.length) {
          emptyChase('None yet');
          return;
        }
        renderChase(rows);
      } catch (err) {
        if (gen !== chaseGen) return;
        emptyChase('Couldn\u2019t load');
      }
    }

    function fillSetOptions(filterText) {
      const sel = $('set');
      const prev = sel.value;
      const q = (filterText || '').trim().toLowerCase();
      const list = allSets.filter(s => {
        if (!q) return true;
        return (s.name + ' ' + (s.series || '') + ' ' + s.id).toLowerCase().includes(q);
      });
      sel.innerHTML = '';
      if (!list.length) {
        const o = document.createElement('option');
        o.value = '';
        o.textContent = 'No sets match';
        sel.appendChild(o);
        return;
      }
      list.slice().reverse().forEach(s => {
        const o = document.createElement('option');
        o.value = s.id;
        o.textContent = s.name + ' (' + (s.releaseDate || '?') + ')';
        sel.appendChild(o);
      });
      if (prev && list.some(s => s.id === prev)) sel.value = prev;
      else if (params.get('set') && list.some(s => s.id === params.get('set'))) sel.value = params.get('set');
    }

    function syncSet() {
      const s = setsById[$('set').value];
      const link = $('ebayLink');
      if (!s) {
        link.hidden = true;
        $('ripLine').textContent = '—';
        emptyChase('None yet');
        return;
      }
      if (s.ebaySoldUrl) {
        link.href = s.ebaySoldUrl;
        link.hidden = false;
      } else {
        link.hidden = true;
      }
      if (s.ebayLastSoldUsd != null) $('cost').value = Number(s.ebayLastSoldUsd).toFixed(2);
      loadChase(s.id);
      calc();
    }

    function calc() {
      const line = $('ripLine');
      const s = setsById[$('set').value];
      const { dead, odds, chase } = modelOf(s);
      if (!s || !odds || odds < 1 || !Number.isFinite(dead) || !Number.isFinite(chase)) {
        line.textContent = '—';
        return;
      }
      const ev = dead * (1 - 1 / odds) + chase * (1 / odds);
      const cost = Number($('cost').value);
      line.textContent = '';
      if (!Number.isFinite(cost) || cost <= 0) {
        line.append('EV ' + money(ev) + ' per pack');
        return;
      }
      const edge = ev - cost;
      line.append('EV ' + money(ev) + ' per pack · ');
      const span = document.createElement('span');
      if (Math.abs(edge) < 0.005) {
        span.textContent = 'even';
      } else if (edge > 0) {
        span.className = 'up';
        span.textContent = money(edge) + ' gain';
      } else {
        span.className = 'down';
        span.textContent = money(Math.abs(edge)) + ' loss';
      }
      line.append(span);
    }

    fetch('data/sets.json').then(r => r.json()).then(sets => {
      allSets = sets;
      setsById = Object.fromEntries(sets.map(s => [s.id, s]));
      fillSetOptions('');
      if (params.get('set')) $('set').value = params.get('set');
      syncSet();
      $('set').onchange = syncSet;
      $('setFilter').oninput = function () {
        const before = $('set').value;
        fillSetOptions(this.value);
        if ($('set').value !== before) syncSet();
      };
      $('cost').addEventListener('input', calc);
      $('cost').addEventListener('change', calc);
    });
  </script>
  <script src="border.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
