<body>
  <div class="wrap">
    <nav class="nav">
      <span class="brand">PackEV</span>
      <a href="index.html">Sets</a>
      <a href="prices.html">Prices</a>
      <a href="rip.html">Pack EV</a>
      <a href="shows.html">Shows</a>

      <span id="auth-nav" class="auth-nav">
        <a href="join.html">Join</a>
        <a href="login.html">Log in</a>
      </span>
    </nav>
    <div class="card">
      <p class="tip"><a id="backLink" href="prices.html">← Back to prices</a></p>
      <div id="status" class="loading">Loading card…</div>
      <div id="detail" class="card-detail" hidden>
        <div class="card-detail-main">
          <div class="card-detail-art" id="art"></div>
          <div class="card-detail-info">
            <h1 id="name">—</h1>
            <p class="lead" id="meta"></p>
            <div class="card-detail-price" id="priceBlock"></div>
            <div class="price-change" id="priceChange" hidden></div>
            <div id="gradedMount"></div>
            <div class="sold-block" id="soldBlock"></div>
          </div>
        </div>
        <section class="card-detail-history">
          <h2>Price history</h2>
          <div id="historyMount" class="history-panel" style="margin:0"></div>
        </section>
      </div>
    </div>
    <footer>PackEV · educational prices</footer>
  </div>
  <script src="border.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
